global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          environment: 'local'

  - job_name: 'scizor-tracker'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s 
    static_configs:
      - targets: ['scizor-tracker:8080']
        labels:
          application: 'scizor-tracker'
          service: 'api'
          environment: 'local'
