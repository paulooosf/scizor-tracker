spring:
  application:
    name: scizor-tracker
  
  datasource:
    url: jdbc:postgresql://localhost:5432/scizor_tracker
    username: ${POSTGRES_USER:scizor_user}
    password: ${POSTGRES_PASSWORD:scizor_password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    defer-datasource-initialization: true
  
  flyway:
    enabled: false
  
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: false
  
  kafka:
    bootstrap-servers: kafka:9092
    admin:
      fail-fast: false
    consumer:
      group-id: scizor-tracker-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: app.vercel.paulooosf.scizor_tracker.dto.evento
        spring.json.use.type.headers: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
  
  security:
    user:
      name: admin
      password: admin

api:
  security:
    token:
      secret: ${JWT_SECRET:scizor-tracker-secret-key-change-in-production-2026}

aws:
  region: us-east-1
  endpoint: http://localstack:4566
  sns:
    topic-arn: arn:aws:sns:us-east-1:000000000000:bug-notificacoes
  credentials:
    access-key: test
    secret-key: test

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: local
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
