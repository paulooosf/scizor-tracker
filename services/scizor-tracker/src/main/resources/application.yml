spring:
  application:
    name: scizor-tracker
  
  datasource:
    url: jdbc:postgresql://localhost:5432/scizor_tracker
    username: ${POSTGRES_USER:scizor_user}
    password: ${POSTGRES_PASSWORD:scizor_password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    defer-datasource-initialization: true
  
  flyway:
    enabled: false
  
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: false
  
  security:
    user:
      name: admin
      password: admin

api:
  security:
    token:
      secret: ${JWT_SECRET:scizor-tracker-secret-key-change-in-production-2026}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: local
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
